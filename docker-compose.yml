services:

  # The WebRTC realtime transport (aiortc, in-process Pipecat) gathers ICE on
  # ephemeral UDP ports that can't be predicted/published in Docker bridge mode,
  # so the whole stack runs on host networking. Consequences: `ports:` mappings
  # are dropped (services bind host ports directly) and inter-service addressing
  # uses 127.0.0.1 instead of Docker DNS names.
  vauxr:
    build:
      context: .
      dockerfile: Dockerfile
    image: vauxr:latest
    container_name: vauxr
    restart: unless-stopped
    network_mode: host
    depends_on:
      whisper:
        condition: service_healthy
      piper:
        condition: service_healthy
    environment:
      # Neutral values win in config.py; empty values use legacy names below.
      STT_URL: ${STT_URL:-}
      TTS_URL: ${TTS_URL:-}
      TTS_VOICE: ${TTS_VOICE:-}
      WHISPER_URL: ${WHISPER_URL:-tcp://127.0.0.1:10300}
      PIPER_URL: ${PIPER_URL:-tcp://127.0.0.1:10200}
      OPENCLAW_URL: ${OPENCLAW_URL:-}
      OPENCLAW_TOKEN: ${OPENCLAW_TOKEN:-}
      DEVICE_TOKEN: ${DEVICE_TOKEN}
      PIPER_VOICE: ${PIPER_VOICE:-en_US-libritts_r-medium}
      DATA_DIR: /data
      SSL_CERT_FILE: /certs/root.crt
      # Realtime WebRTC is opt-in (off by default): set REALTIME_ENABLED=1 in
      # your .env to turn it on. When enabled, REALTIME_HOST must be the server's
      # LAN IP/hostname — the device receives an absolute /api/offer URL built
      # from it in the hello policy, and aiortc uses it to advertise reachable
      # ICE candidates. (Host networking below is required only for realtime's
      # ephemeral ICE UDP ports; it's otherwise harmless for WS-only deploys.)
      REALTIME_ENABLED: ${REALTIME_ENABLED:-0}
      REALTIME_ESP32: ${REALTIME_ESP32:-1}
      REALTIME_HOST: ${REALTIME_HOST:-}
      REALTIME_STUN_URL: ${REALTIME_STUN_URL:-stun:stun.l.google.com:19302}
      # Diagnostic: when set, the realtime pipeline writes the decoded inbound
      # WebRTC audio (exactly what Silero/Whisper see) to per-session WAVs here.
      # Leave empty to disable. Point at /data/recordings to land files in the
      # host bind-mount below.
      VAUXR_RECORD_DIR: ${VAUXR_RECORD_DIR:-}
    volumes:
      - ./data:/data
      - ./certs/root.crt:/certs/root.crt:ro
      - ./recordings:/data/recordings
      - ./firmware:/data/firmware

  whisper:
    image: rhasspy/wyoming-whisper
    container_name: whisper
    restart: unless-stopped
    network_mode: host
    command: --model small-int8 --language en --uri tcp://0.0.0.0:10300
    volumes:
      - ./data/whisper:/data
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket; s=socket.create_connection(('localhost',10300),1); s.close()\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 300s

  piper:
    image: rhasspy/wyoming-piper
    container_name: piper
    restart: unless-stopped
    network_mode: host
    command: --voice en_US-libritts_r-medium --uri tcp://0.0.0.0:10200
    volumes:
      - ./data/piper:/data
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket; s=socket.create_connection(('localhost',10200),1); s.close()\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 300s

  # Optional CPU speech services; registration does not change selections.
  parakeet-v3:
    profiles: [speech-extra]
    image: rhasspy/wyoming-whisper@sha256:c3c6a1bca0b72ad8df0fbb00d315ff58f349270d3c40b9611b8a7f6ae28fd58f
    container_name: parakeet-v3
    restart: unless-stopped
    network_mode: host
    command: ["--stt-library", "sherpa", "--model", "sherpa-onnx-nemo-parakeet-tdt-0.6b-v3-int8", "--language", "en", "--device", "cpu", "--cpu-threads", "4", "--uri", "tcp://127.0.0.1:10310", "--data-dir", "/data", "--download-dir", "/data"]
    volumes:
      - ${PARAKEET_CACHE_DIR:-./data/parakeet-v3}:/data
    healthcheck:
      test: ["CMD-SHELL", "/usr/src/.venv/bin/python3 -m wyoming_faster_whisper.health_check --uri tcp://127.0.0.1:10310"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 300s

  kokoro:
    profiles: [speech-extra]
    image: nordwestt/kokoro-wyoming@sha256:5071dfe6a7c2c599c51677da698aebecdf8bd8dbab2d5345e99bb50d878a33f9
    container_name: kokoro
    restart: unless-stopped
    network_mode: host
    environment:
      ONNX_PROVIDER: CPUExecutionProvider
    volumes:
      - ${KOKORO_CACHE_DIR:-./data/kokoro}:/data
    # Seed only missing cache files from the pinned image; retain existing models.
    entrypoint: ["/bin/sh"]
    command:
      - -ec
      - "for f in kokoro-v1.0.onnx voices-v1.0.bin; do test -f /data/\"$$f\" || cp /app/src/\"$$f\" /data/\"$$f\"; done; exec /usr/bin/python3 /app/src/main.py --uri tcp://127.0.0.1:10210 --voice af_heart --model /data/kokoro-v1.0.onnx --voices /data/voices-v1.0.bin"
    healthcheck:
      test: ["CMD-SHELL", "/usr/bin/python3 -c 'import socket,json; s=socket.create_connection((\"127.0.0.1\",10210),2); s.settimeout(2); s.sendall(b\"{\\\"type\\\":\\\"describe\\\"}\\n\"); f=s.makefile(\"rb\"); h=json.loads(f.readline()); d=json.loads(f.read(h[\"data_length\"])) if h.get(\"data_length\") else h.get(\"data\",{}); assert h[\"type\"]==\"info\" and d.get(\"tts\"); s.close()'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 300s
