[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vauxr"
version = "2.0.0a0"
description = "Vauxr voice gateway — STT/LLM/TTS pipeline server"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Lillian Mikus" }]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "aiohttp>=3.10",
    "pydantic>=2.7",
    "bcrypt>=4.1",
    "cryptography>=42",
    "uvloop>=0.19; sys_platform != 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
# Realtime WebRTC transport (in-process Pipecat pipeline). Only needed when
# REALTIME_ENABLED=1; the core WS server runs without these.
realtime = [
    "pipecat-ai[webrtc,silero]>=1.3",
    # Pipecat's smallwebrtc request/connection handlers import fastapi/starlette
    # (SmallWebRTCRequest model) and websockets (connection callback); neither is
    # pulled by the [webrtc] extra.
    "fastapi>=0.115",
    "websockets>=12",
]

[project.scripts]
vauxr = "server:main"

[project.urls]
Homepage = "https://github.com/vauxr-ai/vauxr"

# Flat layout: server modules live directly under src/ (not src/vauxr/).
# Hatchling collects every .py under src/ into the wheel's top level, so
# `python -m server` works on any install path with src/ on PYTHONPATH.
[tool.hatch.build.targets.wheel]
sources = ["src"]
include = ["src/*.py"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"
