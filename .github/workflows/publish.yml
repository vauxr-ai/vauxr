name: Publish Docker Image

on:
  push:
    branches: [main, develop, "feat/**", "fix/**"]
  pull_request:
  release:
    types: [published]

jobs:
  # On every push/PR: run the Python test suite
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package + dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest
        run: pytest -q

  # On push to main: compute version and create a draft release
  draft-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [pytest]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute version tag
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TODAY=$(date -u +%-Y.%-m.%-d)
          EXISTING=$(gh api repos/${{ github.repository }}/git/refs/tags \
            --paginate --jq '.[].ref' 2>/dev/null \
            | grep "^refs/tags/${TODAY}-" || true)

          if [ -z "$EXISTING" ]; then
            N=0
          else
            MAX=$(echo "$EXISTING" \
              | sed "s|refs/tags/${TODAY}-||" \
              | sort -n \
              | tail -1)
            N=$((MAX + 1))
          fi

          VERSION="${TODAY}-${N}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Computed version: ${VERSION}"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.version }}" \
            --title "${{ steps.version.outputs.version }}" \
            --draft \
            --notes "## What's Changed\n\n<!-- Add release notes here before publishing -->"

  # On release published: build and push to Docker Hub
  publish:
    if: github.event_name == 'release'
    needs: [pytest]
    runs-on: ubuntu-latest
    environment: Production
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive image name
        id: image
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          echo "name=vauxr/${REPO_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.event.release.tag_name }}
            ${{ steps.image.outputs.name }}:latest
