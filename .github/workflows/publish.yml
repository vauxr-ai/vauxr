name: CI

permissions:
  contents: read

on:
  # Long-lived branches only. Feature/fix branches get CI via pull_request, so
  # scoping push to main/develop avoids the duplicate push+pull_request run on
  # every PR commit (a branch that's both in this filter and an open PR fires both).
  push:
    branches: [main, develop]
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  design-lint:
    name: DESIGN.md lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-client/package-lock.json
      - run: npm --prefix web-client ci
      - run: npm --prefix web-client run design:lint

  design-check:
    name: Management design finish gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm --prefix web-client ci
      - run: npm --prefix web-client run build
      - run: npm --prefix e2e ci
      - run: npm --prefix e2e exec -- playwright install --with-deps chromium
      - run: node --test scripts/design-check.test.mjs
      - run: node scripts/design-check.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: design-check-report
          path: e2e/test-results/design-check.json

  # On every push/PR: run the Python test suite
  pytest:
    name: Unit tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package + dev and realtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,realtime]"

      - name: Require real Pipecat media-authority coverage (no skips)
        run: |
          python -m pytest -q tests/test_realtime_media_authority.py --junitxml=realtime-media-authority.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET

          cases = ET.parse("realtime-media-authority.xml").findall(".//testcase")
          if not cases or any(case.find(tag) is not None for case in cases
                              for tag in ("skipped", "failure", "error")):
              raise SystemExit("Required realtime media-authority tests must run without skips or failures")
          print(f"Required realtime media-authority coverage: {len(cases)} passed, zero skipped")
          PY

      - name: Run pytest
        run: pytest -q

  # Keep the container ownership smoke and exercise the owner/browser contract
  # against isolated aiohttp servers. Legacy shared-token channel forms are gone.
  e2e-container:
    name: E2E container ownership smoke
    runs-on: ubuntu-latest
    needs: [pytest]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build vauxr image
        run: docker build -t vauxr:e2e .

      - name: Pre-seed /data with Alpine-era ownership
        # Simulates an existing deployment that ran the previous Node
        # image (which created files in /data as uid 100). The new
        # container must remain able to write here; owner console bootstrap
        # verifies persistence without restoring legacy credential endpoints.
        run: |
          docker volume create vauxr-e2e-data
          docker run --rm -v vauxr-e2e-data:/data alpine sh -c '
            printf "{}\n" > /data/config.json
            chown 100:101 /data /data/config.json
            chmod 0755 /data
          '

      - name: Start vauxr container
        run: |
          docker run -d --name vauxr-e2e \
            -p 8080:8080 -p 8765:8765 \
            -e DATA_DIR=/data \
            -v vauxr-e2e-data:/data \
            vauxr:e2e
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:8080/api/auth/status; then
              # Exercise the existing-volume write boundary; never print the claim code.
              docker exec vauxr-e2e python -c 'from vauxr.auth.service import get_store; from vauxr.auth.owner import OwnerAuth; OwnerAuth(get_store()).console_claim()'
              echo "vauxr ready; owner bootstrap persisted"; exit 0
            fi
            sleep 1
          done
          echo "vauxr never became ready"
          docker logs vauxr-e2e
          exit 1

      - name: Dump container logs on failure
        if: failure()
        run: docker logs vauxr-e2e

      - name: Set up Node for web-client unit tests
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Run web-client unit tests once before browser domains
        run: |
          npm --prefix web-client ci
          npm --prefix web-client test -- --run

  e2e-domains:
    name: Playwright (${{ matrix.domain }})
    runs-on: ubuntu-latest
    needs: [pytest, e2e-container]
    strategy:
      fail-fast: false
      matrix:
        domain: [agents, management, voice, design]
    env:
      VAUXR_E2E_DOMAIN: ${{ matrix.domain }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python for isolated browser servers
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install isolated server dependencies
        run: python -m pip install -e ".[dev]"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Build web client for isolated browser servers
        run: |
          npm --prefix web-client ci
          npm --prefix web-client run build

      - name: Install e2e deps
        working-directory: e2e
        run: npm ci || npm install

      - name: Install Playwright browser
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Validate complete domain coverage
        run: node --test scripts/playwright-domains.test.mjs

      - name: Run Playwright tests
        working-directory: e2e
        # Both auth specs own disposable servers/data; no shared-token forms.
        # Includes loopback integration workflows and LAN browser restrictions.
        run: npx playwright test --reporter=github,list,html,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/results.json

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-${{ matrix.domain }}
          path: |
            e2e/playwright-report/
            e2e/test-results/results.json
            e2e/test-results/**/screenshots/
          retention-days: 7

      - name: Upload targeted design triage evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: design-triage-evidence-${{ matrix.domain }}
          path: /tmp/vauxr-design-triage/
          if-no-files-found: ignore
          retention-days: 7

  # Retain the original required-check name and release dependency.
  e2e:
    name: E2E UI smoke (Playwright)
    runs-on: ubuntu-latest
    if: always()
    needs: [pytest, e2e-container, e2e-domains]
    steps:
      - name: Require every browser domain and container smoke
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'const jobs = JSON.parse(process.env.RESULTS); if (Object.values(jobs).some(job => job.result !== "success")) process.exit(1)'

  # On push to main: compute version and create a draft release
  draft-release:
    name: Draft release (main only)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [pytest, e2e, design-lint, design-check]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Compute version tag
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TODAY=$(date -u +%-Y.%-m.%-d)

          ALL_TAGS=$(gh api repos/${{ github.repository }}/git/refs/tags \
            --paginate --jq '.[].ref' 2>/dev/null || true)

          BASE_TAG="refs/tags/${TODAY}"
          HAS_BASE=false
          if echo "$ALL_TAGS" | grep -qxF "$BASE_TAG"; then
            HAS_BASE=true
          fi

          SUFFIX_TAGS=$(echo "$ALL_TAGS" | grep "^refs/tags/${TODAY}-" || true)

          if [ "$HAS_BASE" = false ] && [ -z "$SUFFIX_TAGS" ]; then
            VERSION="${TODAY}"
          else
            MAX_N=0
            if [ -n "$SUFFIX_TAGS" ]; then
              MAX_N=$(echo "$SUFFIX_TAGS" | sed "s|refs/tags/${TODAY}-||" | sort -n | tail -1)
            fi
            VERSION="${TODAY}-$((MAX_N + 1))"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Computed version: ${VERSION}"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.version }}" \
            --title "${{ steps.version.outputs.version }}" \
            --draft \
            --notes "## What's Changed\n\n<!-- Add release notes here before publishing -->"

  # On release published: build and push to Docker Hub
  publish:
    name: Publish Docker image (release only)
    if: github.event_name == 'release'
    needs: [pytest, e2e, design-lint, design-check]
    runs-on: ubuntu-latest
    environment: Production
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive image name
        id: image
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          echo "name=vauxr/${REPO_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.event.release.tag_name }}
            ${{ steps.image.outputs.name }}:latest
