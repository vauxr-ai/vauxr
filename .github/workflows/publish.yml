name: CI

on:
  push:
    branches: [main, develop, "feat/**", "fix/**"]
  pull_request:
  release:
    types: [published]

jobs:
  # On every push/PR: run the Python test suite
  pytest:
    name: Unit tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package + dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest
        run: pytest -q

  # On every push/PR: run the Playwright UI smoke test against a real
  # container. Catches regressions where channel CRUD 500s — including
  # the Alpine→slim docker uid drift that broke /data writes after the
  # Python rewrite.
  e2e:
    name: E2E UI smoke (Playwright)
    runs-on: ubuntu-latest
    needs: [pytest]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build vauxr image
        run: docker build -t vauxr:e2e .

      - name: Pre-seed /data with Alpine-era ownership
        # Simulates an existing deployment that ran the previous Node
        # image (which created files in /data as uid 100). The new
        # container must remain able to write here; otherwise channel
        # create/rotate hit PermissionError → 500.
        run: |
          docker volume create vauxr-e2e-data
          docker run --rm -v vauxr-e2e-data:/data alpine sh -c '
            printf "{}\n" > /data/config.json
            chown 100:101 /data /data/config.json
            chmod 0755 /data
          '

      - name: Start vauxr container
        run: |
          docker run -d --name vauxr-e2e \
            -p 8080:8080 -p 8765:8765 \
            -e DEVICE_TOKEN=e2e-device-token \
            -e DATA_DIR=/data \
            -v vauxr-e2e-data:/data \
            vauxr:e2e
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null \
                 -H "Authorization: Bearer e2e-device-token" \
                 http://localhost:8080/api/devices; then
              echo "vauxr ready"; exit 0
            fi
            sleep 1
          done
          echo "vauxr never became ready"
          docker logs vauxr-e2e
          exit 1

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install e2e deps
        working-directory: e2e
        run: npm ci || npm install

      - name: Install Playwright browser
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: e2e
        env:
          VAUXR_DEVICE_TOKEN: e2e-device-token
          VAUXR_URL: http://localhost:8080
        run: npx playwright test

      - name: Dump container logs on failure
        if: failure()
        run: docker logs vauxr-e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  # On push to main: compute version and create a draft release
  draft-release:
    name: Draft release (main only)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [pytest, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Compute version tag
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TODAY=$(date -u +%-Y.%-m.%-d)

          ALL_TAGS=$(gh api repos/${{ github.repository }}/git/refs/tags \
            --paginate --jq '.[].ref' 2>/dev/null || true)

          BASE_TAG="refs/tags/${TODAY}"
          HAS_BASE=false
          if echo "$ALL_TAGS" | grep -qxF "$BASE_TAG"; then
            HAS_BASE=true
          fi

          SUFFIX_TAGS=$(echo "$ALL_TAGS" | grep "^refs/tags/${TODAY}-" || true)

          if [ "$HAS_BASE" = false ] && [ -z "$SUFFIX_TAGS" ]; then
            VERSION="${TODAY}"
          else
            MAX_N=0
            if [ -n "$SUFFIX_TAGS" ]; then
              MAX_N=$(echo "$SUFFIX_TAGS" | sed "s|refs/tags/${TODAY}-||" | sort -n | tail -1)
            fi
            VERSION="${TODAY}-$((MAX_N + 1))"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Computed version: ${VERSION}"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.version }}" \
            --title "${{ steps.version.outputs.version }}" \
            --draft \
            --notes "## What's Changed\n\n<!-- Add release notes here before publishing -->"

  # On release published: build and push to Docker Hub
  publish:
    name: Publish Docker image (release only)
    if: github.event_name == 'release'
    needs: [pytest, e2e]
    runs-on: ubuntu-latest
    environment: Production
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive image name
        id: image
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          echo "name=vauxr/${REPO_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.event.release.tag_name }}
            ${{ steps.image.outputs.name }}:latest
