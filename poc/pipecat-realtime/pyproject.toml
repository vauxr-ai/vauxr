[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vauxr-pipecat-poc"
version = "0.0.1"
description = "Isolated Pipecat WebRTC PoC for Vauxr — feel-test before embedding"
requires-python = ">=3.12"
dependencies = [
    "pipecat-ai[webrtc,silero,openai,runner]>=1.2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
piper-local = ["pipecat-ai[piper]"]

[tool.setuptools]
py-modules = ["bot", "wyoming_services"]
